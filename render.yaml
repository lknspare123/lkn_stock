services:
  - type: web
    name: lkn-stock
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: CLOUDINARY_URL
        sync: false
